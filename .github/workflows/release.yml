# Instaladores de Alforja (ahora solo Windows; macOS y Linux están comentados abajo).
# Se lanza al subir a la rama "release" (git push origin main:release), al subir
# una etiqueta v* o a mano desde la pestaña Actions. La etiqueta del release sale
# de la versión de la app (src-tauri/tauri.conf.json): v0.1.0.
# Deja un borrador de release en GitHub con los instaladores; publícalo a mano.
# Sin firmar: Windows (SmartScreen) y macOS (Gatekeeper) avisarán la primera vez.
name: release

on:
  push:
    branches: ["release"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # Para macOS y Linux, quita el "#" de estas líneas. En un repositorio
          # privado, los minutos de macOS gastan bastante más cuota de Actions.
          # - platform: macos-latest
          #   args: "--target aarch64-apple-darwin"
          # - platform: macos-latest
          #   args: "--target x86_64-apple-darwin"
          # - platform: ubuntu-22.04
          #   args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Alforja v__VERSION__"
          releaseBody: "Instaladores sin firmar. Lee el README para el primer arranque."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
